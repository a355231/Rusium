# Standalone Rust port of net/base/mime_util. Not wired into GN yet.
[package]
name = "mime_util"
version = "0.1.0"
edition = "2021"
publish = false

# Keep cargo from searching parent directories for a workspace.
[workspace]

[dependencies]
http_util = { path = "../../../http/rust/http_util" }
string_split = { path = "../../../../base/strings/rust/string_split" }
file_path = { path = "../../../../base/files/rust/file_path" }
