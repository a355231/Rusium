# Standalone Rust port of base/strings/string_util. Not wired into GN yet.
[package]
name = "string_util"
version = "0.1.0"
edition = "2021"
publish = false

# Keep cargo from searching parent directories for a workspace.
[workspace]

[dependencies]

# Test-only: ASCII/UTF-16 conversion helpers used to build test inputs, the
# same way the C++ tests use ASCIIToUTF16() and UTF16ToASCII().
[dev-dependencies]
utf_string_conversions = { path = "../utf_string_conversions" }
